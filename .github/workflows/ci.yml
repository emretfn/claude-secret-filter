name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # On a pull request the guard scripts come from the base branch, so a pull request
      # cannot loosen the checks it is judged by. A change to a guard script lands in a
      # pull request of its own first.
      - name: Guard scripts from the base branch
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/guard"
          for f in check-no-egress.py check-version-bump.py; do
            if [ -n "$BASE" ] && git show "origin/$BASE:scripts/$f" > "$RUNNER_TEMP/guard/$f" 2>/dev/null && grep -q -- '--root' "$RUNNER_TEMP/guard/$f"; then
              echo "using origin/$BASE:scripts/$f"
            else
              cp "scripts/$f" "$RUNNER_TEMP/guard/$f"   # a push to main, or a base without --root yet
            fi
          done
      - name: No egress in the mod's code
        run: python3 "$RUNNER_TEMP/guard/check-no-egress.py" --root "$GITHUB_WORKSPACE"
      - name: Version bumped when shipped files change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: python3 "$RUNNER_TEMP/guard/check-version-bump.py" --root "$GITHUB_WORKSPACE" "origin/$BASE"
      - name: gitleaks rules are generated, not hand-edited
        run: |
          python3 scripts/gen-gitleaks-rules.py
          git diff --exit-code -- hooks/gitleaks-rules.ts

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate, and check the engine calls the module makes
        run: |
          claude plugin validate --strict --json . > "$RUNNER_TEMP/validate.json"
          guard=scripts/check-no-egress.py
          if [ "${{ github.event_name }}" = pull_request ] && git show "origin/${{ github.base_ref }}:$guard" > "$RUNNER_TEMP/egress.py" 2>/dev/null && grep -q -- '--root' "$RUNNER_TEMP/egress.py"; then
            guard="$RUNNER_TEMP/egress.py"   # the base branch's copy, as in the guard job
          fi
          python3 "$guard" --root "$GITHUB_WORKSPACE" --validate "$RUNNER_TEMP/validate.json"
      - name: Tests
        run: claude plugin test .
