<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>secret-filter · How it works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · secret-filter</p>
    <h1>How secret-filter sits between Claude and its tools</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How secret-filter sits between Claude and its tools</title>
        <desc id="architecture-desc">Tool output passes through the mod's read hook and redaction engine, so Claude only sees placeholders; real values stay in an in-memory vault, seeded from .env files, and the write hook puts them back when Claude edits a file.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONE ============ -->
        <rect x="352" y="200" width="720" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="928" y="204" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="992" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SECRET-FILTER MOD</text>

        <!-- ============ ARROWS (before nodes) ============ -->
        <!-- 1. Claude -> Read hook: tool call -->
        <line x1="240" y1="264" x2="382" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="284" y="244" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="253" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

        <!-- 2. Read hook -> Tools: run (up) -->
        <line x1="464" y1="232" x2="464" y2="154" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="428" y="186" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="442" y="195" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

        <!-- 3. Tools -> Read hook: raw output (down) -->
        <line x1="544" y1="152" x2="544" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="552" y="174" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="183" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RAW OUTPUT</text>

        <!-- 4. Read hook -> Engine: redact -->
        <line x1="624" y1="284" x2="766" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="672" y="264" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="273" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REDACT</text>

        <!-- 5. Read hook -> Claude: masked output (headline path) -->
        <line x1="384" y1="304" x2="242" y2="304" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="276" y="284" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="293" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLACEHOLDERS</text>

        <!-- 6. Engine -> Vault: store real value (down) -->
        <line x1="904" y1="336" x2="904" y2="414" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="912" y="370" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="948" y="379" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REAL VALUES</text>

        <!-- 7. Claude -> Write hook: edit with placeholder -->
        <line x1="240" y1="448" x2="382" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="276" y="428" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="437" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EDIT · WRITE</text>

        <!-- 8. Write hook -> Claude: result, masked again (return) -->
        <line x1="384" y1="488" x2="242" y2="488" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="284" y="468" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="477" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RE-MASKED</text>

        <!-- 9. Vault -> Write hook: restore -->
        <line x1="768" y1="468" x2="626" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="668" y="448" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="457" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESTORE</text>

        <!-- 10. Write hook -> Files: real value written (down) -->
        <line x1="504" y1="520" x2="504" y2="590" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="512" y="562" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="532" y="571" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

        <!-- 11. .env files -> Vault: seed at session start (passive) -->
        <line x1="1104" y1="468" x2="1042" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="1056" y="448" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1072" y="457" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEED</text>

        <!-- ============ NODES ============ -->
        <!-- Claude (input) -->
        <rect x="64" y="232" width="176" height="288" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="232" width="176" height="288" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="72" y="238" width="40" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="92" y="247" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="152" y="372" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claude</text>
        <text x="152" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sees placeholders only</text>

        <!-- Tools (external) -->
        <rect x="384" y="72" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="72" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="392" y="78" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="410" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
        <text x="504" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bash, Read, Web, MCP</text>
        <text x="504" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">output may hold secrets</text>

        <!-- Read hook (backend) -->
        <rect x="384" y="232" width="240" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="232" width="240" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="408" y="247" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="504" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Read hook</text>
        <text x="504" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tool.call, failed calls too</text>
        <text x="504" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">refuses Bash with placeholders</text>

        <!-- Redaction engine (focal) -->
        <rect x="768" y="232" width="272" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="232" width="272" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="776" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="792" y="247" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="904" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redaction engine</text>
        <text x="904" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">known values, formats, gitleaks</text>
        <text x="904" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">named fields, entropy, env mode</text>

        <!-- Write hook (backend) -->
        <rect x="384" y="416" width="240" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="416" width="240" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="422" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="408" y="431" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="504" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Write hook</text>
        <text x="504" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Edit, Write, NotebookEdit</text>
        <text x="504" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">unknown placeholder: refused</text>

        <!-- Vault (focal, store) -->
        <rect x="768" y="416" width="272" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="416" width="272" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="776" y="422" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="798" y="431" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
        <text x="904" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Vault</text>
        <text x="904" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">placeholder id → real value</text>
        <text x="904" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">never on disk, never to the model</text>

        <!-- Files (external) -->
        <rect x="384" y="592" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="592" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="392" y="598" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="408" y="607" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="504" y="632" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Project files</text>
        <text x="504" y="648" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">get the real values</text>

        <!-- .env files (store) -->
        <rect x="1104" y="416" width="144" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="1104" y="416" width="144" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1112" y="422" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="1130" y="431" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
        <text x="1176" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">.env files</text>
        <text x="1176" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read at session</text>
        <text x="1176" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">start</text>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="684" x2="1240" y2="684" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="705" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="696" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="144" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">Holds or masks secrets</text>

        <rect x="296" y="696" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">Mod hook</text>

        <rect x="408" y="696" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="432" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">Outside the mod</text>

        <line x1="560" y1="702" x2="592" y2="702" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="604" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">What Claude reads</text>

        <line x1="728" y1="702" x2="760" y2="702" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="772" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">Data flow</text>

        <line x1="864" y1="702" x2="896" y2="702" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="908" y="705" fill="#2d3142" font-size="9" font-family="'Geist', system-ui, sans-serif">Return or session start</text>
      </svg>
    </div>
  </div>
</body>
</html>
